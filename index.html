<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Cravers</title>

  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="apple-touch-icon" href="/icon-192.png" />

  <link rel="manifest" href="/manifest.json" />

  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .tile { transition: transform .12s ease, box-shadow .12s ease; }
    .tile:active, .tile:hover { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(0,0,0,.15); }
  </style>
</head>
<body class="min-h-screen bg-slate-950 text-slate-50">
  <div id="cr_lock" class="fixed inset-0 flex items-center justify-center bg-black/90 z-[9999]">
    <div class="w-[360px] max-w-[92%] p-6 rounded-xl bg-slate-900 text-center shadow-2xl">
      <img src="/icon-192.png" class="w-14 mx-auto mb-2 rounded-lg" alt="">
      <h2 class="text-lg font-semibold mb-2">Cravers — dostęp</h2>
      <div id="loginWrap">
        <p class="text-xs text-slate-400 mb-2">Wpisz PIN</p>
        <input id="pinInput" inputmode="numeric" placeholder="PIN"
               class="w-full text-lg px-3 py-2 rounded-lg bg-slate-800 border border-white/10 mb-2 outline-none">
        <label class="flex items-center justify-center gap-2 text-xs text-slate-400 mb-2 select-none">
          <input id="rememberCheck" type="checkbox"> Zapamiętaj na 30 dni
        </label>
        <div class="flex justify-center gap-2">
          <button id="unlockBtn" class="px-4 py-2 rounded-lg bg-emerald-600 hover:bg-emerald-500 font-semibold">Wejdź</button>
          <button id="logoutBtn" class="px-4 py-2 rounded-lg bg-slate-700">Wyloguj</button>
        </div>
        <p id="lockMsg" class="mt-2 text-rose-300 text-sm"></p>
      </div>
      <p class="mt-3 text-xs text-slate-500">Zapomniałeś PIN? Wyczyść dane witryny / localStorage.</p>
    </div>
  </div>

  <div class="mx-auto max-w-5xl px-4 py-6 sm:py-10">
    <main id="view" class="mt-0"></main>
  </div>

  <script>
    /************* KONFIG LINKÓW *************
     * TYLKO ID PLIKÓW DLA PDFÓW!
     *****************************************/
    const LINKS = {
      oferty: {
        wesele: {
          2026: '12nC-tLsALrsNhSn4K_OqL4fIllUspLPR',
          2027: '1i58nooBe62mBEiqPWiay5EvIFHHnOAuO',
          2028: '1PUBO75O_clReMCjICj28PsCyjSdMKXiL',
        },
        studniowka: {
          2026: '149DnIzA21811MVuF3EoyEOBV76rE7EsP', // TODO: wklej ID pliku
          2027: '1rYuA_Qh98x-VKrjGw_MPp48wsXfsTeBm', // TODO: wklej ID pliku
          2028: '11-1TntlpCRcoHZop-Mt-vFzttjFvTxC7', // TODO: wklej ID pliku
        },
      },
      podpisz: {
        // PEŁNE LINKI DO FORMULARZY
        weselna: 'https://docs.google.com/forms/d/e/1FAIpQLSeqM0EvJmnepVRwYDc_mZ9ngosOVM_di0MohkLFo2x7xKJdfA/viewform?embedded=true',
        inna:    'https://docs.google.com/forms/d/e/1FAIpQLSdNPcRvczZBNgoDnp2MkIVN6H81DG4dt91cs-LEQ-Z2bku-3g/viewform?embedded=true',
      },
      pozostale: {
        ustalenia:  '', // ID PDF z przykładowymi ustaleniami
        scenariusz: ''  // ID PDF z przykładowym scenariuszem
      }
    };
    /*****************************************/

    // POMOCNIKI UI
    const el = (tag, cls, html) => {
      const e = document.createElement(tag);
      if (cls) e.className = cls;
      if (html != null) e.innerHTML = html;
      return e;
    };

    function tile(label, sub, onclick, gradient='from-sky-600 to-sky-800', emoji='📄') {
      const b = el('button', `tile rounded-3xl bg-gradient-to-br ${gradient} p-5 text-left w-full`);
      b.onclick = onclick;
      b.append(el('div', 'text-3xl', emoji));
      b.append(el('div', 'mt-2 text-lg font-semibold', label));
      if (sub) b.append(el('div', 'text-white/80 text-sm', sub));
      return b;
    }

    function makeActionButton(text, variant='primary') {
      const base = 'px-3 py-1.5 rounded-lg text-sm font-medium transition';
      let cls = base + ' ';
      if (variant === 'primary') cls += 'bg-emerald-600 hover:bg-emerald-500';
      else if (variant === 'secondary') cls += 'bg-slate-800 hover:bg-slate-700';
      else cls += 'bg-slate-900 hover:bg-slate-800';
      const b = el('button', cls, text);
      return b;
    }

    // ZMODYFIKOWANA FUNKCJA rowWithActions - usunięto przycisk drukuj
    function rowWithActions(label, urlOrFileId) {
      if (!urlOrFileId) {
        const box = el(
          'div',
          'rounded-2xl bg-slate-900/40 p-4 text-xs sm:text-sm text-slate-500 border border-dashed border-slate-700',
          label + ' — brak linku (uzupełnij w LINKS w index.html)'
        );
        return box;
      }
      
      const isDriveFile = urlOrFileId.length < 100 && !urlOrFileId.startsWith('http');
      const box = el('div', 'rounded-2xl bg-slate-900/80 p-4 space-y-3 shadow');
      box.append(el('div', 'text-sm sm:text-base font-semibold', label));

      const btnRow = el('div', 'flex flex-wrap gap-2');
      const openBtn  = makeActionButton('Otwórz', 'primary');
      const copyBtn  = makeActionButton('Kopiuj link', 'secondary');

      openBtn.onclick  = () => openInViewer(urlOrFileId);
      copyBtn.onclick  = () => copyLink(urlOrFileId);
      
      btnRow.append(openBtn, copyBtn);
      box.append(btnRow);
      return box;
    }

    function section(title) {
      const d = el('div', 'mb-6');
      d.append(el('h3', 'text-base font-semibold mb-2', title));
      return d;
    }

    const view = document.getElementById('view');

    // ROUTER
    function go(hash){ location.hash = hash; }
    window.addEventListener('hashchange', render);
    render();

    function render(){
      const h = location.hash || '#/';
      view.innerHTML = '';

      if (h === '#/' || h === '#')        return renderHome();
      if (h === '#/oferty')              return renderOferty();
      if (h.startsWith('#/oferty/wesele'))      return renderOfertyRok('wesele');
      if (h.startsWith('#/oferty/studniowka'))  return renderOfertyRok('studniowka');
      if (h === '#/podpisz')             return renderPodpisz();
      if (h === '#/pozostale')           return renderPozostale();

      view.textContent = 'Nie znaleziono strony.';
    }

    function renderHome(){
      const grid = el('div','grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-3');
      grid.append(
        tile('Oferty','Wesele / Studniówka', ()=>go('#/oferty'),'from-sky-600 to-sky-800','💼'),
        tile('Podpisz umowę','Formularze Google', ()=>go('#/podpisz'),'from-emerald-600 to-emerald-800','✍️'),
        tile('Pozostałe','Ustalenia / Scenariusz', ()=>go('#/pozostale'),'from-amber-600 to-amber-800','🧷')
      );
      view.append(grid);
    }

    function renderOferty(){
      const grid = el('div','grid grid-cols-1 gap-4 sm:grid-cols-2');
      grid.append(
        tile('Wesele','2026 / 2027 / 2028', ()=>go('#/oferty/wesele'),'from-indigo-600 to-indigo-800','💒'),
        tile('Studniówka','2026 / 2027 / 2028', ()=>go('#/oferty/studniowka'),'from-rose-600 to-rose-800','🎓')
      );
      view.append(grid);
    }

    function renderOfertyRok(type){
      const nice = type === 'wesele' ? 'Wesele' : 'Studniówka';
      view.append(el('h2','text-xl font-semibold mb-4', `Oferty — ${nice}`));

      const wrap = el('div','space-y-3');
      const years = Object.keys(LINKS.oferty[type] || {}).sort();
      years.forEach(y => {
        const urlOrFileId = LINKS.oferty[type][y];
        wrap.append(rowWithActions(`${nice} ${y}`, urlOrFileId));
      });
      view.append(wrap);
    }

    function renderPodpisz(){
      view.append(el('h2','text-xl font-semibold mb-4','Podpisz umowę'));
      const wrap = el('div','space-y-3');
      wrap.append(rowWithActions('Umowa Weselna (może uzupełnić klient)', LINKS.podpisz.weselna));
      wrap.append(rowWithActions('Umowa Inne Imprezy (uzupełnia Cravers)',    LINKS.podpisz.inna));
      view.append(wrap);
    }

    function renderPozostale(){
      view.append(el('h2','text-xl font-semibold mb-4','Pozostałe materiały'));
      const wrap = el('div','space-y-3');
      wrap.append(rowWithActions('Przykładowe ustalenia',  LINKS.pozostale.ustalenia));
      wrap.append(rowWithActions('Przykładowy scenariusz', LINKS.pozostale.scenariusz));
      view.append(wrap);
    }

    // UPROSZCZONA FUNKCJA openInViewer
    function openInViewer(urlOrFileId){
      if (!urlOrFileId) return alert('Brak linku.');
      
      const isDriveFile = urlOrFileId.length < 100 && !urlOrFileId.startsWith('http');
      let targetUrl;

      if (isDriveFile) {
        // TO JEST PLIK Z DRIVE (PDF) - Otwieramy w nowej karcie
        targetUrl = `https://drive.google.com/file/d/${urlOrFileId}/preview`;
        window.open(targetUrl, '_blank');
        return; 
      } else {
        // TO JEST PEŁNY URL (Formularz) - Otwieramy w viewer.html
        targetUrl = `viewer.html?src=${encodeURIComponent(urlOrFileId)}`;
        location.href = targetUrl;
      }
    }

    // FUNKCJA copyLink (bez zmian, pracuje na ID lub pełnym URL)
    async function copyLink(urlOrFileId){
      if (!urlOrFileId) return alert('Brak linku.');
      
      const isDriveFile = urlOrFileId.length < 100 && !urlOrFileId.startsWith('http');
      const urlToCopy = isDriveFile 
        ? `https://drive.google.com/file/d/${urlOrFileId}/view?usp=sharing` // Skopiuj standardowy link do udostępniania
        : urlOrFileId; // Skopiuj pełny URL formularza

      try {
        await navigator.clipboard.writeText(urlToCopy);
        toast('Skopiowano link ✅');
      } catch {
        prompt('Skopiuj ręcznie:', urlToCopy);
      }
    }

    function toast(txt){
      const t = el('div','fixed bottom-4 left-1/2 -translate-x-1/2 bg-slate-900/90 text-white px-4 py-2 rounded-xl ring-1 ring-white/10 shadow text-sm');
      t.textContent = txt; document.body.append(t);
      setTimeout(()=>t.remove(), 1800);
    }

    /******************* PIN (narzucony) — zapamiętaj 30 dni *******************/
    async function sha256hex(msg) {
      const enc = new TextEncoder();
      const data = enc.encode(msg);
      const hash = await crypto.subtle.digest('SHA-256', data);
      return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2,'0')).join('');
    }

    const PRESET_PIN_HASH = '0315b4020af3eccab7706679580ac87a710d82970733b8719e70af9b57e7b9e6'; // PIN = 4242 (podmień hash)
    const PIN_KEY  = 'cravers_pin_hash';
    const AUTH_KEY = 'cravers_auth_token';

    function nowMs(){ return Date.now(); }
    function setAuthToken(token, days=30){
      const until = nowMs() + days*24*3600*1000;
      localStorage.setItem(AUTH_KEY, JSON.stringify({token, until}));
    }
    function clearAuth(){ localStorage.removeItem(AUTH_KEY); }
    function getAuth(){
      try {
        const raw = localStorage.getItem(AUTH_KEY);
        if (!raw) return null;
        const obj = JSON.parse(raw);
        if (!obj.until || nowMs() > obj.until) {
          localStorage.removeItem(AUTH_KEY);
          return null;
        }
        return obj;
      } catch { return null; }
    }
    function isAuthed(){ return !!getAuth(); }

    const lock = document.getElementById('cr_lock');
    const pinInput = document.getElementById('pinInput');
    const rememberCheck = document.getElementById('rememberCheck');
    const unlockBtn = document.getElementById('unlockBtn');
    const logoutBtn = document.getElementById('logoutBtn');
    const lockMsg = document.getElementById('lockMsg');

    async function setupLock(){
      if (!localStorage.getItem(PIN_KEY)) localStorage.setItem(PIN_KEY, PRESET_PIN_HASH);
      if (isAuthed()) {
        lock.classList.add('hidden');
      } else {
        lock.classList.remove('hidden');
      }
    }

    unlockBtn.onclick = async () => {
      lockMsg.textContent = '';
      const val = pinInput.value.trim();
      if (!val) { lockMsg.textContent='Wpisz PIN'; return; }
      const h = await sha256hex(val);
      const stored = localStorage.getItem(PIN_KEY);
      if (h === stored) {
        setAuthToken(h, rememberCheck.checked ? 30 : 0.08); // ~2h gdy bez "zapamiętaj"
        lock.classList.add('hidden');
        pinInput.value='';
      } else {
        lockMsg.textContent='Błędny PIN';
      }
    };

    logoutBtn.onclick = () => {
      clearAuth();
      lock.classList.remove('hidden');
    };

    setupLock();

    // Service worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () =>
        navigator.serviceWorker.register('/service-worker.js').catch(()=>{})
      );
    }
  </script>
</body>
</html>
